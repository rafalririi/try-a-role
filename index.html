:root{
  --bg:#0c0913; --surf:#18121f; --surf2:#221a30; --line:#30263f; --text:#f2eefa; --muted:#b6abc9;
  --soc1:#6d4aff; --soc2:#b39dff; --phi1:#c04cff; --phi2:#ff6fd8; --soe1:#8f6bff; --soe2:#d9ccff;
  --ok:#9ff0cf; --bad:#ff6b8a; --warn:#ffc46b;
  --g-soc:linear-gradient(135deg,var(--soc1),var(--soc2));
  --g-phi:linear-gradient(135deg,var(--phi1),var(--phi2));
  --g-soe:linear-gradient(135deg,var(--soe1),var(--soe2));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 15% 0%,rgba(124,92,255,.30),transparent 40%),radial-gradient(circle at 90% 100%,rgba(192,76,255,.16),transparent 40%),
  linear-gradient(rgba(200,180,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(200,180,255,.03) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
h1:focus,h2:focus{outline:none}
#app{max-width:480px;min-height:100%;margin:0 auto;padding:22px 18px 28px;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;gap:16px;flex:1;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.sg{font-family:"Space Grotesk",Inter,sans-serif}
.lab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:11px;letter-spacing:.1em;padding:6px 10px;border-radius:999px;background:var(--surf2);color:var(--muted);white-space:nowrap}
h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:38px;line-height:1.02;letter-spacing:-.01em}
h2{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:26px;line-height:1.1}
h3{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:19px;line-height:1.2}
p{line-height:1.5}
.muted{color:var(--muted)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px}
.btn{min-height:56px;border-radius:18px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:#f2eefa;color:#0c0913}
.btn.ghost{border:1px solid var(--line);color:var(--text);background:var(--surf)}
.btn.soc{background:var(--g-soc);color:#fff}.btn.phi{background:var(--g-phi);color:#fff}.btn.soe{background:var(--g-soe);color:#1a0f33}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:#cbb8ff;text-decoration:underline;text-underline-offset:3px;font-size:14px;align-self:center;padding:8px}
.grow{flex:1}
/* hub tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:24px;padding:16px;min-height:158px;text-align:left;display:flex;flex-direction:column;gap:6px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile.wide{grid-column:span 2;min-height:132px}
.tile:not(.wide) .art{opacity:.16;bottom:-34px;right:-22px}
.tile .ico{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.tile .nm{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:18px;line-height:1.1;margin-top:auto}
.tile .at{font-size:13px;opacity:.9}
.tile .st{position:absolute;top:14px;right:14px;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:11px;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.25);color:#fff}
.tile .art{position:absolute;right:-10px;bottom:-14px;opacity:.28;pointer-events:none}
.tile.soc{background:var(--g-soc);color:#fff}.tile.phi{background:var(--g-phi);color:#fff}.tile.soe{background:var(--g-soe);color:#1a0f33}
.tile.soe .ico{background:rgba(0,0,0,.12)}.tile.soe .st{background:rgba(0,0,0,.2)}
.tile.locked{background:var(--surf);border:1px dashed #46395f;box-shadow:none;color:#d8cfe8}
.tile.locked .ico{background:rgba(255,255,255,.06)}
.tile.locked .st{background:var(--surf2);color:var(--muted)}
.tile.done::after{content:"";position:absolute;inset:0;border-radius:24px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.75)}
/* hero art */
.hero{display:flex;justify-content:center;padding:6px 0}
/* steps */
.steps{display:flex;gap:6px}
.steps div{flex:1;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-align:center;padding:7px 0;border-radius:8px;background:var(--surf2);color:var(--muted)}
.steps .done{background:#2a1d4a;color:#c2b0ff}.steps .now{background:var(--g-soc);color:#fff}
/* options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surf);border:1px solid var(--line);text-align:left;font-size:15px;line-height:1.4;transition:background .15s,border-color .15s}
.opt:hover{border-color:#5b4a7a}
.opt .k{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px;min-width:24px;height:24px;border-radius:7px;border:1px solid #5b4a7a;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.opt.right{border-color:var(--ok);background:rgba(124,245,200,.1)}.opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,138,.1)}.opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt.half{border-color:var(--warn);background:rgba(255,181,71,.1)}.opt.half .k{border-color:var(--warn);color:var(--warn)}
.fb.mid{background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.45)}
.opt[disabled]{cursor:default}
.fb{border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.5}
.fb.ok{background:rgba(124,245,200,.1);border:1px solid rgba(124,245,200,.4)}
.fb.no{background:rgba(255,107,138,.1);border:1px solid rgba(255,107,138,.4)}
.fb b.t{display:block;font-family:"Space Grotesk",sans-serif;font-size:17px;margin-bottom:3px}
/* timer */
.timer{position:relative;width:54px;height:54px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px}
/* alert / log */
.alert{border-radius:16px;padding:14px;background:#1e1226;border:1px solid #5e2a52}
.log{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.7;background:#110c1b;border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto;white-space:pre}
/* phishing */
.stack{position:relative;height:410px;touch-action:pan-y}
.stack .ghost{position:absolute;inset:14px 14px 0;border-radius:22px;background:var(--surf2);transform:rotate(3deg)}
.msg{position:absolute;inset:0;border-radius:22px;background:#f6f7fb;color:#14161b;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 30px rgba(0,0,0,.45);user-select:none;cursor:grab;transition:transform .25s ease}
.msg.dragging{transition:none;cursor:grabbing}
.msg .kind{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;color:#5b616c}
.msg .from{font-size:13.5px;color:#4b515c;line-height:1.4}
.msg .subj{font-weight:700;font-size:16px}
.msg .body{font-size:15.5px;line-height:1.5}
.msg .bubble{background:#e6e9ef;border-radius:16px;padding:12px 14px}
.stamp{position:absolute;top:22px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:22px;padding:4px 12px;border-radius:10px;border:3px solid;opacity:0;pointer-events:none}
.stamp.l{left:18px;color:#e2531f;border-color:#e2531f;transform:rotate(-12deg)}
.stamp.r{right:18px;color:#0f9a6e;border-color:#0f9a6e;transform:rotate(12deg)}
.seg{border-radius:5px;padding:1px 2px;transition:background .15s;cursor:pointer}
.flagmode .seg{background:rgba(20,22,27,.05);box-shadow:inset 0 -2px 0 rgba(20,22,27,.2)}
.flagmode .seg.picked{background:#ffe1c7;box-shadow:inset 0 -2px 0 #e86c1a}
.flagmode .seg.hit{background:#c9f5e4;box-shadow:inset 0 -2px 0 #0f9a6e}
.flagmode .seg.miss{background:#ffd6de;box-shadow:inset 0 -2px 0 #d23a5c;text-decoration:line-through}
.flagmode .seg.missed{background:#fff2b8;box-shadow:inset 0 -2px 0 #c99a00}
.msgstatic{position:relative;border-radius:22px;background:#f6f7fb;color:#14161b;padding:18px;display:flex;flex-direction:column;gap:10px}
.reasons{display:flex;flex-direction:column;gap:8px}
.reason{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
.reason b{color:#f3a8ff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* call */
.caller{display:flex;align-items:center;gap:12px}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;position:relative}
.avatar::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--soe1);animation:ring 1.6s infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
.meter{height:10px;border-radius:999px;background:var(--surf2);overflow:hidden}
.meter div{height:100%;border-radius:999px;background:linear-gradient(90deg,#ffb547,#ff6fd8);transition:width .6s ease}
.chat{display:flex;flex-direction:column;gap:9px}
.bub{max-width:86%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;animation:in .3s ease}
.bub.them{background:var(--surf2);border-bottom-left-radius:6px;align-self:flex-start}
.bub.me{background:var(--g-soe);color:#1a0f33;border-bottom-right-radius:6px;align-self:flex-end;font-weight:500}
/* result */
.big{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:56px;line-height:1}
.rows{display:flex;flex-direction:column}
.rows div{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.4}
.rows div:last-child{border:0}
.tip{border-radius:22px;padding:18px;background:#f5f2ea;color:#14161b}
.tip .lab{color:#5d6370}
.badge{width:96px;height:96px;margin:0 auto;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f2eefa;color:#0c0913;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;animation:in .25s ease}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.foot{text-align:center;font-size:12px;color:#9085a8;margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:700px){ #app{padding-top:40px} h1{font-size:44px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- v2: drag & interaction ---------- */
.ghost-drag{position:fixed;left:0;top:0;z-index:60;pointer-events:none;opacity:.95;transform-origin:center;box-shadow:0 18px 40px rgba(0,0,0,.55)!important;transition:none!important}
.lifted{opacity:.35}
.sel{outline:3px solid #e4d9ff;outline-offset:3px}
[data-drop].over{outline:3px dashed #e4d9ff;outline-offset:4px}
.drag{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.drag:active{cursor:grabbing}
.float{position:fixed;z-index:70;pointer-events:none;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:22px;text-shadow:0 2px 10px rgba(0,0,0,.6);animation:floatup 1s ease forwards}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.sound{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--surf2);color:var(--muted)}
.hint{font-size:13px;color:#e4d9ff;text-align:center;font-weight:600}
.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* tool tray */
.tray{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;border-radius:18px;background:var(--surf);border:1px dashed #46395f}
.tool{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:16px;background:linear-gradient(135deg,#e4d9ff,#a98bff);color:#1a0f33;box-shadow:0 8px 24px rgba(169,139,255,.35)}

/* network map */
.net{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;background:#110c1b;border:1px solid var(--line);position:relative}
.netrow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.netlink{flex:1;height:3px;background:repeating-linear-gradient(90deg,#6d4aff 0 6px,transparent 6px 12px);opacity:.6}
.bus{height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,#6d4aff,transparent);opacity:.7}
.pcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.node{border-radius:14px;padding:9px 6px 8px;background:var(--surf2);border:2px solid #3b2f55;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:#ddd5ea;position:relative;transition:background .2s,border-color .2s;min-height:68px;display:flex;flex-direction:column;align-items:center;gap:4px}
.node .st2{font-size:9px;letter-spacing:.08em;padding:2px 6px;border-radius:999px;background:rgba(124,245,200,.14);color:var(--ok)}
.node.inf{background:#3a1033;border-color:#ff6fd8;color:#fff;animation:infpulse .9s infinite}
.node.inf .st2{background:#ff6fd8;color:#fff}
@keyframes infpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,111,216,.6)}50%{box-shadow:0 0 0 7px rgba(255,111,216,0)}}
.node.iso{background:#16111f;border-color:#5b4a7a;border-style:dashed;color:#a598ba}
.node.iso .st2{background:#33284a;color:#d8cfe8}
.node.small{min-height:auto;padding:7px 8px;flex-direction:row;gap:6px}
.server{border-radius:14px;padding:10px 12px;background:var(--surf2);border:2px solid #3b2f55;font-family:"IBM Plex Mono",monospace;font-size:12px}
.bar{height:8px;border-radius:999px;background:#251c35;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:linear-gradient(90deg,#ffb547,#ff6fd8);width:0;transition:width .1s linear}
.overlay{position:absolute;inset:0;border-radius:20px;background:rgba(7,11,22,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:5}

/* chips & slots */
.chips{display:flex;flex-direction:column;gap:8px}
.chipd{padding:11px 13px;border-radius:13px;background:var(--surf2);border:1px solid #3e3157;font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.45;color:#e9e3f3;text-align:left;display:flex;gap:10px;align-items:center}
.chipd .grip{flex:none;width:10px;height:18px;background:radial-gradient(circle,#7f7098 1.4px,transparent 1.6px) 0 0/5px 6px;opacity:.9}
.chipd.placed{background:#2a1d4a;border-color:#6d4aff}
.chipd.good{background:rgba(124,245,200,.12);border-color:var(--ok)}
.chipd.badc{background:rgba(255,107,138,.12);border-color:var(--bad)}
.zone{min-height:74px;border-radius:16px;border:2px dashed #4c3b72;background:rgba(124,92,255,.07);padding:10px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.zone .ph{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;color:#9686b2;text-align:center}
.fw{display:flex;align-items:center;gap:10px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:16px;margin-bottom:6px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:stretch}
.slot .n{flex:none;width:34px;border-radius:10px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:18px;color:#c2b0ff}
.slot .zone{flex:1;min-height:52px;padding:6px}

/* phishing flags */
.pins{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px;border-radius:16px;background:var(--surf);border:1px dashed #5a2a6a}
.pin{width:46px;height:46px;border-radius:12px;background:var(--g-phi);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(192,76,255,.3)}
.pin.used{visibility:hidden}
.flagmode .seg.picked::before{content:"";display:inline-block;width:12px;height:14px;margin-right:3px;vertical-align:-2px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 14'><path d='M1 0v14' stroke='%23e2531f' stroke-width='2'/><path d='M2 1h9l-2 3 2 3H2z' fill='%23ff3d77'/></svg>") no-repeat}
.swipehint{animation:wiggle 2.2s ease-in-out 2}
@keyframes wiggle{0%,100%{transform:none}20%{transform:translateX(-28px) rotate(-3deg)}45%{transform:translateX(28px) rotate(3deg)}65%{transform:none}}

/* phone call */
.callscreen{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:30px}
.bigav{width:120px;height:120px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center;position:relative}
.bigav::before,.bigav::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--soe1);animation:ring 1.8s infinite}
.bigav::after{animation-delay:.9s}
.slider{position:relative;height:66px;border-radius:999px;background:var(--surf);border:1px solid var(--line);overflow:hidden;width:100%}
.slider .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted);font-size:15px;letter-spacing:.02em;pointer-events:none}
.slider .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;opacity:.35}
.slider .knob{position:absolute;left:5px;top:5px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;z-index:2}
.slider.green .knob,.slider.green .fill{background:var(--g-soe)}
.slider.red .knob,.slider.red .fill{background:linear-gradient(135deg,#ff6fd8,#ff6b8a)}
.notif{position:fixed;left:50%;top:12px;width:min(440px,92vw);transform:translate(-50%,-140%);z-index:55;background:rgba(238,243,255,.97);color:#111;border-radius:18px;padding:12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.5);display:flex;gap:12px;align-items:center;transition:transform .35s cubic-bezier(.2,1.2,.4,1);touch-action:none;cursor:grab}
.notif.show{transform:translate(-50%,0)}
.notif .ic{flex:none;width:38px;height:38px;border-radius:10px;background:#8f6bff;display:flex;align-items:center;justify-content:center}
.turnbar{height:6px;border-radius:999px;background:var(--surf2);overflow:hidden}
.turnbar div{height:100%;background:var(--g-soe);width:100%}

.toast{bottom:auto!important;top:16px;pointer-events:none}
.flagmode .body,.flagmode .from{line-height:1.9}
.flagmode .seg{padding:3px 3px}

/* ---------- v3 hub: reference-style role cards ---------- */
#app.wide{max-width:1080px}
.hubhead{max-width:640px}
.hubh{font-size:46px;font-weight:500;letter-spacing:-.025em;line-height:1}
.grad{background:linear-gradient(90deg,#b39dff,#e4d9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.rlab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b39dff}
.rgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.hubh{font-size:60px}}
.rcard{position:relative;text-align:left;display:flex;flex-direction:column;gap:8px;padding:18px 18px 16px;border-radius:26px;
 background:linear-gradient(180deg,#1c1528,#120e1b);border:1px solid #2f2545;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 18px 40px rgba(0,0,0,.35);
 transition:transform .2s,border-color .2s,box-shadow .2s;overflow:hidden}
.rcard:hover,.rcard:focus-visible{transform:translateY(-4px);border-color:#7b62d6;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 50px rgba(77,50,170,.35)}
.rcard.done{border-color:#4a3a78}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rdone{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(159,240,207,.12);color:#9ff0cf}
.rart{position:relative;display:flex;justify-content:center;align-items:center;height:150px;margin:2px 0 4px}
.rart::before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);filter:blur(6px)}
.rart svg{position:relative}
.rname{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:22px;line-height:1.1;color:#f2eefa}
.rdesc{font-size:14px;line-height:1.45;color:#b6abc9;min-height:40px}
.rfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.rpill{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,#e4d9ff,#a98bff);color:#1a0f33}
.rmeta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#a598ba;letter-spacing:.04em}

 <path d="M50 4 L61 14 L76 12 L80 27 L94 34 L88 48 L94 62 L80 69 L76 84 L61 82 L50 94 L39 82 L24 84 L20 69 L6 62 L12 48 L6 34 L20 27 L24 12 L39 14Z" fill="url(#b${k})"/>

 soc:{name:"SOC Analyst",attack:"Ransomware",max:400,habit:"Update your devices.",habitText:"Turn on automatic updates and keep a backup."},

const app=document.getElementById("app");
const $=(sel,el=app)=>el.querySelector(sel);
const $$=(sel,el=app)=>[...el.querySelectorAll(sel)];
let TIMERS=[];const every=(f,ms)=>{const id=setInterval(f,ms);TIMERS.push(id);return id};const later=(f,ms)=>{const id=setTimeout(f,ms);TIMERS.push(id);return id};
const stopTimers=()=>{TIMERS.forEach(id=>{clearInterval(id);clearTimeout(id)});TIMERS=[];const n=document.querySelector(".notif");if(n)n.remove()};
function render(html){stopTimers();SEL=null;app.classList.remove("wide");app.innerHTML=`<div class="screen">${html}</div>`;window.scrollTo(0,0);const h=$("h1,h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}}
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const badges=()=>Object.keys(S.scores).length;

/* ---------------- juice: sound, haptics, floating points ---------------- */
let AC=null;
function tone(f,d,type="sine",vol=.06,delay=0){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={good(){tone(660,.09,"triangle");tone(990,.14,"triangle",.06,.08)},bad(){tone(170,.28,"sawtooth",.04)},drop(){tone(520,.05,"triangle",.05)},pick(){tone(380,.04,"triangle",.04)},
 alarm(){tone(880,.08,"square",.025);tone(660,.08,"square",.025,.1)},win(){[523,659,784,1046].forEach((f,i)=>tone(f,.16,"triangle",.06,i*.09))},ring(){tone(740,.12,"sine",.05);tone(740,.12,"sine",.05,.18)}};
const buzz=(ms=25)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function floatAt(el,txt,color="#d9ccff"){const r=(el&&el.getBoundingClientRect)?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0};const d=document.createElement("div");d.className="float";d.style.left=(r.left+r.width/2)+"px";d.style.top=(r.top-6)+"px";d.style.color=color;d.textContent=txt;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function shake(el){if(!el)return;el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}

function wireSound(){const b=$("#snd");if(b)b.onclick=()=>{S.mute=!S.mute;save();b.textContent=S.mute?"SOUND OFF":"SOUND ON";b.setAttribute("aria-pressed",!S.mute);if(!S.mute)sfx.pick()}}

/* confetti */
const fx=document.getElementById("fx"),cx=fx.getContext("2d");let parts=[];
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;fx.width=innerWidth;fx.height=innerHeight;
 const cols=["#6d4aff","#b39dff","#c04cff","#ff6fd8","#8f6bff","#d9ccff","#e4d9ff"];const start=!parts.length;
 for(let i=0;i<140;i++)parts.push({x:innerWidth/2,y:innerHeight*0.35,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,s:Math.random()*7+4,c:cols[i%cols.length],r:Math.random()*6,life:120});
 if(!start)return;(function loop(){cx.clearRect(0,0,fx.width,fx.height);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.1;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<fx.height+20);if(parts.length)requestAnimationFrame(loop);else cx.clearRect(0,0,fx.width,fx.height)})();}

/* ---------------- drag & drop engine (mouse + touch, with tap fallback) ---------------- */
let DRAG=null, SEL=null;
function draggable(el,opts){
 el.classList.add("drag");
 el.addEventListener("pointerdown",e=>{if(el.dataset.off||e.button>0)return;e.preventDefault();const r=el.getBoundingClientRect();
  DRAG={el,opts,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,h:r.height,moved:false,ghost:null,over:null}});
 el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();selectItem(el,opts)}});
 if(!el.hasAttribute("tabindex"))el.setAttribute("tabindex","0");
}
function selectItem(el,opts){if(SEL&&SEL.el===el){el.classList.remove("sel");SEL=null;return}if(SEL)SEL.el.classList.remove("sel");SEL={el,opts};el.classList.add("sel");sfx.pick();if(opts.onSelect)opts.onSelect(el)}
function dropzone(el,type){el.dataset.drop=type;el.addEventListener("click",e=>{if(!SEL)return;const acc=SEL.opts.accept||[];if(!acc.includes(type))return;e.stopPropagation();const s=SEL;s.el.classList.remove("sel");SEL=null;s.opts.onDrop(el,s.el)})}
window.addEventListener("pointermove",e=>{if(!DRAG)return;const d=DRAG,dx=e.clientX-d.sx,dy=e.clientY-d.sy;
 if(!d.moved){if(Math.hypot(dx,dy)<6)return;d.moved=true;const g=d.el.cloneNode(true);g.classList.add("ghost-drag");g.classList.remove("sel","lifted");g.style.width=d.w+"px";g.style.height=d.h+"px";document.body.appendChild(g);d.ghost=g;d.el.classList.add("lifted");sfx.pick();if(SEL){SEL.el.classList.remove("sel");SEL=null}}
 d.ghost.style.transform=`translate(${e.clientX-d.ox}px,${e.clientY-d.oy}px) rotate(${clamp(dx/30,-6,6)}deg) scale(1.05)`;
 const under=document.elementFromPoint(e.clientX,e.clientY);let t=under&&under.closest("[data-drop]");if(t&&!(d.opts.accept||[]).includes(t.dataset.drop))t=null;
 if(d.over!==t){if(d.over)d.over.classList.remove("over");if(t)t.classList.add("over");d.over=t}});
function endDrag(e,cancel){if(!DRAG)return;const d=DRAG;DRAG=null;
 if(d.moved){d.ghost.remove();d.el.classList.remove("lifted");if(d.over){d.over.classList.remove("over");if(!cancel){sfx.drop();buzz(15);d.opts.onDrop(d.over,d.el);return}}if(d.opts.onCancel)d.opts.onCancel(d.el)}
 else if(!cancel){selectItem(d.el,d.opts)}}
window.addEventListener("pointerup",e=>endDrag(e,false));window.addEventListener("pointercancel",e=>endDrag(e,true));

/* slide-to-act control */
function slider(el,onDone){const knob=$(".knob",el),fill=$(".fill",el);let sx=0,x=0,drag=false,done=false;const max=()=>el.clientWidth-66;
 const set=v=>{x=clamp(v,0,max());knob.style.transform=`translateX(${x}px)`;fill.style.width=(x+61)+"px"};
 knob.addEventListener("pointerdown",e=>{if(done)return;drag=true;sx=e.clientX-x;knob.setPointerCapture(e.pointerId);knob.style.transition="none"});
 knob.addEventListener("pointermove",e=>{if(drag)set(e.clientX-sx)});
 const up=()=>{if(!drag)return;drag=false;knob.style.transition="transform .25s";if(x>max()*.8){done=true;set(max());sfx.good();buzz(30);onDone()}else{set(0);fill.style.width="0"}};
 knob.addEventListener("pointerup",up);knob.addEventListener("pointercancel",up);
 knob.addEventListener("keydown",e=>{if(!done&&(e.key==="Enter"||e.key===" "||e.key==="ArrowRight")){e.preventDefault();done=true;set(max());onDone()}});}
const sliderHTML=(color,label,icon)=>`<div class="slider ${color}" id="sl"><div class="fill"></div><div class="lbl">${label} →</div><button class="knob" aria-label="${label}">${icon}</button></div>`;

/* ---------------- title / hub / brief ---------------- */
function title(){

 ${badges()?`<button class="link" id="reset">Start over</button>`:""}
 <p class="foot">By Rafal &amp; Sedra · scenarios are fictional</p>`);

}
const HUBINFO={

};
function hub(){

 <div id="ask" style="display:none;flex-direction:column;gap:10px"><div class="top"><span class="lab">Your reply</span><span class="mono" style="font-size:12px;color:var(--muted)" id="tl">${T}s</span></div><div class="turnbar"><div id="tb"></div></div>
 <div class="opts">${opts.map((o,j)=>`<button class="opt" data-v="${o[1]}" data-j="${j}"><span class="k">${"ABC"[j]}</span><span>“${o[0]}”</span></button>`).join("")}</div></div>
 <div id="fbk"></div><div class="grow"></div><div id="nx"></div>`);
 later(()=>{const pm=$("#pm");if(pm)pm.style.width=t.press+"%"},80);
 // caller "types" their lines one by one
 t.them.forEach((x,k)=>later(()=>{$("#ch").insertAdjacentHTML("beforeend",`<div class="bub them">${x}</div>`);tone(520,.05,"sine",.03)},350+k*900));
 later(()=>{$("#ask").style.display="flex";$("#ask").scrollIntoView({behavior:"smooth",block:"end"});
   every(()=>{if(answered)return;left-=.1;const tb=$("#tb");if(!tb)return;tb.style.width=Math.max(0,left/T*100)+"%";$("#tl").textContent=Math.ceil(left)+"s";if(left<=0)pick(null)},100)},350+t.them.length*900);
 if(t.otp)later(showOTP,1200);
 const pick=(b)=>{if(answered)return;answered=true;
  const o=b?opts[+b.dataset.j]:null,v=o?o[1]:-1,pts=v===2?100:v===1?40:0;
  $$(".opt").forEach(x=>{x.disabled=true;if(x.dataset.v==="2")x.classList.add("right")});if(b&&v!==2)b.classList.add(v===1?"half":"wrong");
  const said=o?o[0]:"(…you froze. They kept talking.)";soe.hist.push({them:t.them.join(" "),me:said});
  $("#ch").insertAdjacentHTML("beforeend",`<div class="bub me">${said}</div>`);
  if(v===2){soe.safe++;sfx.good()}else{sfx.bad();shake($("#ch"))}soeAdd(pts,b||$("#ch"));
  const n=document.querySelector(".notif");if(n&&v===0){n.classList.remove("show");setTimeout(()=>n.remove(),300)}
  $("#fbk").innerHTML=`<div class="fb ${v===2?"ok":v===1?"mid":"no"}"><b class="t">${v===2?"Safe reply · +100":v===1?"Half-safe · +40":o?"Risky reply · +0":"Time's up · +0"}</b>${o?o[2]:"You froze. You can always hang up."}</div>`;
  if(soe.i<2){$("#nx").innerHTML=`<button class="btn soe" id="nb">Continue the call →</button>`;$("#nb").onclick=()=>{soe.i++;soeTurn()};$("#nb").scrollIntoView({behavior:"smooth",block:"end"})}
  else{$("#nx").innerHTML=sliderHTML("red","Slide to hang up",`<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 15c5-5 13-5 18 0l-2.5 3-3.5-1.5V13a12 12 0 00-6 0v3.5L5.5 18z"/></svg>`);slider($("#sl"),()=>later(soeDone,300));$("#sl").scrollIntoView({behavior:"smooth",block:"end"})}
 };
 $$(".opt").forEach(b=>b.onclick=()=>pick(b));
}
function showOTP(){
 const n=document.createElement("div");n.className="notif";n.setAttribute("role","alert");
 n.innerHTML=`<div class="ic"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 10h10M7 14h6"/></svg></div>
  <div style="flex:1;font-size:13.5px;line-height:1.35"><b>Messages · KAU Login</b><br>Your verification code is <b class="mono">481902</b>. Never share this code with anyone.</div>
  <div class="mono" style="font-size:10px;color:#666;text-align:right">swipe<br>away ↑</div>`;
 document.body.appendChild(n);requestAnimationFrame(()=>n.classList.add("show"));tone(1046,.08,"sine",.05);tone(1318,.1,"sine",.05,.09);buzz([30,40,30]);
 let sy=0,sx=0,dy=0,dx=0,d=false;
 n.addEventListener("pointerdown",e=>{d=true;sy=e.clientY;sx=e.clientX;n.style.transition="none";n.setPointerCapture(e.pointerId)});
 n.addEventListener("pointermove",e=>{if(!d)return;dy=Math.min(0,e.clientY-sy);dx=e.clientX-sx;n.style.transform=`translate(calc(-50% + ${dx}px),${dy}px)`});
 const up=()=>{if(!d)return;d=false;n.style.transition="";if(dy<-40||Math.abs(dx)>90){n.style.transform=`translate(calc(-50% + ${dx*3}px),-160%)`;setTimeout(()=>n.remove(),300);if(!soe.otpGone){soe.otpGone=true;soeAdd(20,null);sfx.good();toast("Code swiped away without reading it out. +20")}}else n.style.transform=""};
 n.addEventListener("pointerup",up);n.addEventListener("pointercancel",up);
 n.addEventListener("click",()=>{if(!soe.otpGone&&!d&&Math.abs(dy)<5){toast("Swipe it away. That code is for you only.")}});
}
function soeDone(){result("soe",soe.score,`${soe.safe}/3 safe replies`)}

/* ================= RESULT & FINISH ================= */
const LEARN={
 soc:["Isolate infected PCs first","It got in through a missing update","Patch, restore from backup, never pay"],
 phi:["Check the real domain","Urgency is a red flag","Never send passwords or codes"],
 soe:["Caller ID can be faked","Never share an OTP","Call the official number yourself"]
};
function result(k,score,sub){
 S.scores[k]=Math.max(score,S.scores[k]||0);save();const r=ROLES[k];
 render(`<div class="top"><span class="ntag">MISSION COMPLETE</span><span class="chip" style="background:var(--g-${k});color:${k==="soe"?"#1a0f33":"#fff"}">BADGE</span></div>
 <div style="text-align:center">${badgeSVG(k)}<div class="big disp" style="margin-top:10px"><span id="cnt">0</span><span class="muted" style="font-size:20px"> / ${r.max}</span></div>
 <p class="muted" style="margin-top:6px">${sub}</p></div>
 <div class="learn">${LEARN[k].map(x=>`<div><span class="dotk"></span>${x}</div>`).join("")}</div>
 <div class="tip"><div class="lab" style="margin-bottom:6px">Your habit</div><h3>${r.habit}</h3><p style="font-size:14.5px;margin-top:4px">${r.habitText}</p></div>
 <div class="grow"></div>
 <button class="btn ${k}" id="nb">${badges()===3?"See final results →":"Back to roles →"}</button><button class="link" id="again">Play again</button>`);
 confetti();sfx.win();buzz([40,60,40]);let c=0;const step=Math.max(1,Math.round(score/40));every(()=>{c=Math.min(score,c+step);const e=$("#cnt");if(e)e.textContent=c;if(c>=score)stopTimers()},25);
 $("#nb").onclick=badges()===3?finish:hub;$("#again").onclick=()=>brief(k);
}
function finish(){
 const total=Object.values(S.scores).reduce((a,b)=>a+b,0),p=total/MAXTOTAL;
 const rank=p>=.85?"Elite Defender":p>=.65?"Cyber Defender":p>=.4?"Apprentice":"Rookie";
 const habit=(k)=>`<div class="hab"><span class="hico" style="background:var(--g-${k})">${ico(k,k==="soe"?"#1a0f33":"#fff",18)}</span><b>${ROLES[k].habit}</b></div>`;
 render(`<div class="top"><span class="ntag">RESULTS</span><span class="chip" style="color:#e4d9ff">★ ${badges()} / 3</span></div>
 <div class="hero">${ART.title()}</div>
 <div class="center"><div class="lab">Your rank</div><div class="glitch disp xl" data-text="${rank}" style="margin-top:6px">${rank}</div><p class="muted" style="margin-top:6px">${total} / ${MAXTOTAL} pts</p></div>
 <div class="tip"><div class="lab" style="margin-bottom:4px">Your 3 habits</div>${["soc","phi","soe"].map(habit).join("")}</div>
 <div class="card center" style="font-size:14px">Suspicious message? Report it:<br><span class="mono" style="color:#cbb8ff">cybersecurity@kau.edu.sa</span></div>
 <button class="btn primary" id="again">Play again</button>${badges()<3?`<button class="link" id="hub">Back to roles</button>`:""}
 <p class="foot">Try a Role: Stop the Attack · Rafal &amp; Sedra · CPCS 463</p>`);
 if(badges()===3){confetti();sfx.win()}
 $("#again").onclick=()=>{S.scores={};save();title()};const h=$("#hub");if(h)h.onclick=hub;
}

(function deco(){const d=document.createElement("div");d.className="circuit";d.setAttribute("aria-hidden","true");d.innerHTML=`<svg width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 1000 1000"><g fill="none" stroke="#a98bff" stroke-width="1.4" vector-effect="non-scaling-stroke"><path d="M0 120 H160 L200 160 H330"/><path d="M0 170 H120 L150 200 H240"/><path d="M1000 860 H830 L790 820 H680"/><path d="M1000 910 H880 L850 880 H760"/><path d="M60 1000 V900 L100 860"/><path d="M940 0 V90 L900 130 H850"/></g></svg>`;document.body.prepend(d)})();
title();

</script>
